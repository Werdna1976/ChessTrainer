<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Practice chess with a Stockfish-powered coach, replay your games, and drill tactics and openings.">
  <title>Chess Trainer</title>
  <script src="./theme.js"></script>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="site-bar">
    <div class="site-bar-inner">
      <a class="brand" href="#play"><span class="brand-mark" aria-hidden="true">♞</span>Chess Trainer</a>
      <nav aria-label="Training">
        <a href="#play" data-mode="play">Coach &amp; play</a>
        <a href="#challenges" data-mode="challenges">Challenges</a>
        <a href="#openings" data-mode="openings">Openings</a>
        <a href="#review" data-mode="review">Game review</a>
      </nav>
      <div class="site-controls">
        <button id="color-mode" class="theme-toggle" type="button" role="switch" aria-label="Dark mode" aria-checked="false" title="Switch to dark mode">
          <svg class="sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/>
          </svg>
          <svg class="moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20.3 15.2A8.5 8.5 0 0 1 8.8 3.7a8.5 8.5 0 1 0 11.5 11.5Z"/>
            <path d="M16.5 3.5v5m-2.5-2.5h5"/>
          </svg>
        </button>
        <button id="appearance" class="secondary">Appearance</button>
      </div>
    </div>
  </header>
  <main>
    <header class="page-header">
      <div><h1 id="title">Coach &amp; play</h1><p id="subtitle">Explore a move before you commit to it.</p></div>
      <div class="header-controls">
        <div class="difficulty" id="difficulty-control">
          <div class="difficulty-heading"><label for="difficulty">Opponent difficulty</label><span id="difficulty-level"></span></div>
          <input id="difficulty" type="range" min="0" max="3" step="1" value="1">
          <div class="difficulty-endpoints" aria-hidden="true"><span>Gentle</span><span>Strong</span></div>
        </div>
        <button id="header-action" class="secondary">New game</button>
      </div>
    </header>
    <div class="workspace">
      <section class="board-area" aria-label="Chess position">
        <div class="board-caption" id="top-player"></div>
        <div id="board" class="board" role="group" aria-label="Chessboard"></div>
        <div class="board-caption bottom"><div id="bottom-player"></div><button id="flip" class="text-button">Flip board</button></div>
      </section>
      <section class="card primary-card" id="panel" aria-label="Training controls"></section>
      <section class="card" id="details" aria-label="Training history and library"></section>
    </div>
    <p id="announcement" class="sr-only" aria-live="polite"></p>
  </main>
  <footer class="site-footer">
    <p id="engine-status"><span class="status-dot"></span> Stockfish 19 Lite</p>
    <button id="backup" class="text-button">Training backups</button>
    <button id="credits" class="text-button">Engine &amp; licenses</button>
  </footer>
  <dialog id="dialog"><div id="dialog-content"></div></dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
